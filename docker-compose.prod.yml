# Production stack. Unlike docker-compose.yml, NOTHING here publishes a port
# except nginx: db, redis, embed, api and worker talk over the compose network
# only, so the datastores are unreachable from outside the host. Do not add a
# `ports:` entry to them to "check something" — use `docker compose exec`.
services:
  db:
    # pgvector image = Postgres 16 + the `vector` extension (embeddings /
    # semantic search). Same PG16 major; existing volumes stay compatible.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arciv}
      # No default: an unset password silently became the empty string, which
      # is a confusing entrypoint failure at best. Fail with the reason instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-arciv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arciv}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loads the ONNX embedding model ONCE; api + worker call it over HTTP
  # (EMBED_SERVICE_URL) instead of each loading their own ~400MB copy. Self-
  # contained build context so the same Dockerfile builds here and on Render.
  embed:
    build:
      context: ./embed-service
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    env_file: .env
    environment:
      EMBED_SERVICE_URL: http://embed:8001
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    env_file: .env
    environment:
      EMBED_SERVICE_URL: http://embed:8001
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_started
    command: python -m arq worker.worker.WorkerSettings

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      # `- api` only waits for the container to exist. The api runs `alembic
      # upgrade head` before uvicorn binds, so nginx would answer 502 for the
      # whole migration window on every deploy.
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
