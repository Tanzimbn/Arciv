name: secret-scan
on: [push, pull_request]

# The local pre-commit hook is bypassable (git commit --no-verify); this CI job
# is the real gate. Scans full history on push so a secret can't slip in via an
# unscanned earlier commit.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for a complete scan
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}