[pytest]
testpaths = tests
addopts = -ra --strict-markers

# The project has no packaging metadata (no pyproject/setup.py), so `api`, `agent`
# and `worker` are only importable when the repo root is on sys.path. `python -m
# pytest` puts the CWD there implicitly and a bare `pytest` does not — without
# this line the suite passes one way and fails to collect the other.
pythonpath = .

# Every test in this suite is async; no per-test decorator needed.
asyncio_mode = auto
# One event loop for the whole session. The app's SQLAlchemy engine is created at
# import time and its asyncpg connections are bound to the loop that opened them,
# so a fresh loop per test would hand out connections attached to a dead loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    integration: needs a live Postgres (pgvector) + Redis. Skipped when unreachable unless ARCIV_REQUIRE_SERVICES=1.
