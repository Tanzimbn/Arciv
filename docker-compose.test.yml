# Throwaway Postgres + Redis for the integration test layer.
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql://arciv:arciv@localhost:55432/arciv_test \
#   TEST_REDIS_URL=redis://localhost:56379/15 pytest
#
# or just `make test`, which does both.
#
# Ports are deliberately NOT the defaults: the dev stack in docker-compose.yml
# publishes 5432/6379, and the suite TRUNCATEs every table between tests, so a
# collision would wipe your development data. The project name is separate too,
# so `docker compose down` on the dev stack never touches these.
name: arciv-test

services:
  db:
    # pgvector, not plain postgres — migration 0012 runs CREATE EXTENSION vector
    # and the search tests execute real cosine-distance queries.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arciv
      POSTGRES_PASSWORD: arciv
      # conftest.py creates arciv_test itself (it connects to `postgres` as the
      # maintenance database), and refuses any name not ending in _test.
      POSTGRES_DB: postgres
    ports:
      # Loopback only. The password is `arciv` and Redis below has none at all,
      # so publishing on every interface hands the test database to anyone on
      # the network. `make test` connects from the host, which still works.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arciv"]
      interval: 2s
      timeout: 5s
      retries: 30
    # No volume: the whole point is that this stack is disposable.

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
