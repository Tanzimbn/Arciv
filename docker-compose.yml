services:
  db:
    # pgvector image = Postgres 16 + the `vector` extension (for embeddings /
    # semantic search). Same PG16 major as before, so existing data volumes stay
    # compatible; migration 0012 runs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arciv
      POSTGRES_PASSWORD: arciv
      POSTGRES_DB: arciv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arciv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local dev SMTP catcher — view sent emails at http://localhost:8025.
  # In .env set: EMAIL_ENABLED=true, SMTP_HOST=mailhog, SMTP_PORT=1025, SMTP_STARTTLS=false
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Dedicated embedding microservice — loads the ONNX model ONCE; api + worker
  # call it over HTTP (EMBED_SERVICE_URL below) instead of each loading their own
  # copy. Mirrors the hosted topology and halves model RAM on a single box.
  # Its Dockerfile COPYs embed-service/, so the build context is the repo root.
  embed:
    build:
      context: .
      dockerfile: embed-service/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      EMBED_SERVICE_URL: http://embed:8001
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    env_file: .env
    environment:
      EMBED_SERVICE_URL: http://embed:8001
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_started
    command: python -m arq worker.worker.WorkerSettings

  # Telegram bot — disabled by default. Enable with TELEGRAM_ENABLED=true in .env
  # and run: docker compose --profile telegram up
  bot:
    profiles: ["telegram"]
    build: .
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
    command: python -c "import sys; sys.path.insert(0, '/app'); exec(open('bot/main.py').read())"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
