services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arciv
      POSTGRES_PASSWORD: arciv
      POSTGRES_DB: arciv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arciv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m arq worker.worker.WorkerSettings

  bot:
    build: .
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
    command: python bot/main.py
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
