<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1a1a1a; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="margin-bottom: 8px;">Reset your password</h2>
    <p>We received a request to reset your Arciv password. Click below to choose a new one.</p>
    <p style="margin: 24px 0;">
      <a href="{{ reset_url }}"
         style="background: #2563eb; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; display: inline-block;">
        Reset password
      </a>
    </p>
    <p style="color: #666; font-size: 13px;">
      Or paste this link into your browser:<br>
      <a href="{{ reset_url }}">{{ reset_url }}</a>
    </p>
    <p style="color: #999; font-size: 12px;">This link expires in {{ ttl_hours }} hour(s). If you didn't request this, ignore this email — your password is unchanged.</p>
  </body>
</html>
