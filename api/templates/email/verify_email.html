<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1a1a1a; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="margin-bottom: 8px;">Confirm your email</h2>
    <p>Welcome to Arciv! Confirm your email address to activate your account.</p>
    <p style="margin: 24px 0;">
      <a href="{{ verify_url }}"
         style="background: #2563eb; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; display: inline-block;">
        Verify email
      </a>
    </p>
    <p style="color: #666; font-size: 13px;">
      Or paste this link into your browser:<br>
      <a href="{{ verify_url }}">{{ verify_url }}</a>
    </p>
    <p style="color: #999; font-size: 12px;">This link expires in {{ ttl_hours }} hours. If you didn't sign up, ignore this email.</p>
  </body>
</html>
