# Secret-scanning + basic hygiene before every commit.
# Setup (once per clone):  pip install pre-commit && pre-commit install
# Run on whole repo:        pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Keep in step with what CI actually runs (gitleaks-action@v2 tracks the
    # latest release). When this lagged at v8.21.2 the hook passed a commit the
    # v8.30.1 in CI then rejected, so the local gate was weaker than the real one.
    rev: v8.30.1
    hooks:
      - id: gitleaks            # blocks commits containing secrets/keys

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key  # SSH/PEM private keys
      - id: check-added-large-files
        args: ["--maxkb=2048"]